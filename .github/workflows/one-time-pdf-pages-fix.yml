name: One-time PDF pages fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_pdf_pages.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm patch_pdf_pages.py .github/workflows/one-time-pdf-pages-fix.yml
          git add index.html patch_pdf_pages.py .github/workflows/one-time-pdf-pages-fix.yml
          git commit -m "Popravi razdelitev strani PDF"
          git push
